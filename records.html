  <body>
    <main>
      <h1>紀錄</h1>
      <p id="records-privacy" class="muted"></p>
      <p id="records-persistence" class="muted">持久儲存：正在問瀏覽器…</p>
      <p><a id="records-back" href="./">回飛行頁</a>　<a id="records-drill" href="drill.html">方向感反射練習</a></p>

      <section aria-label="匯出與匯入">
        <h2>匯出與匯入</h2>
        <p class="muted">匯出成一個 JSON 檔：全部的回合紀錄、每個回合的成績單、方向感反射、單科、分段及完整模擬考的紀錄（練習過才有）、設定（手把的對應與校正、聲音、口令語音，以及這一版用的參數組名字）。匯入時先整份檢查，全部沒問題才寫進來；和這台裝置已經有的回合（與練習）重複的跳過。</p>
        <button type="button" id="records-export">匯出成檔案</button>
        <label class="file-button">匯入檔案…<input type="file" id="records-import" accept="application/json,.json" /></label>
        <div id="records-import-question" role="group" aria-label="設定要蓋掉還是保留" hidden>
          <p id="records-import-question-text"></p>
          <button type="button" id="records-import-keep"></button>
          <button type="button" id="records-import-replace"></button>
        </div>
        <p id="records-said" aria-live="polite"></p>
      </section>

      <section aria-label="術科訓練紀錄">
        <h2>術科訓練紀錄</h2>
        <p class="muted">單科、分段與完整模擬考分開列出；不和舊 B 的趨勢混算。</p>
        <div id="records-exams"></div>
        <div id="records-exam-review"></div>
      </section>
      <section aria-label="依條件分開看">
        <h2>依條件分開看</h2>
        <p class="muted">輸入方式、風段、天候、模式、訓練標準任何一樣不同，就是不同的一組：不同組的成績不混算，也不畫在同一條趨勢上。沒記的條件自成一組。</p>
        <div id="records-groups" role="group" aria-label="條件"></div>
      </section>

      <section aria-label="每個朝向的趨勢">
        <h2>每個朝向的趨勢</h2>
        <p id="records-trend-note" class="muted"></p>
        <div id="records-trends"></div>
      </section>

      <section aria-label="每個回合">
        <h2>每個回合</h2>
        <div class="table-wrap">
          <table id="records-list">
            <thead><tr id="records-list-head"></tr></thead>
            <tbody id="records-rows"></tbody>
          </table>
        </div>
        <p id="records-empty" class="muted" hidden></p>
        <p id="records-unreadable" class="muted" hidden></p>
      </section>
    </main>
  </body>
